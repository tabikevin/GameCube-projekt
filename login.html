<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bejelentkezés - GameCube</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/mobile.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        .doc-container {
            background: rgba(139, 92, 246, 0.05);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 16px;
            padding: 2.5rem;
        }
        .doc-title { font-family: 'Orbitron', sans-serif; font-weight: 900; text-shadow: 0 0 30px rgba(168, 85, 247, 0.6); }
        .gc-input { background: rgba(139,92,246,0.08) !important; border: 1px solid rgba(168,85,247,0.25) !important; color: #f1f5f9 !important; border-radius: 10px !important; }
        .gc-input:focus { border-color: rgba(168,85,247,0.6) !important; box-shadow: 0 0 0 3px rgba(168,85,247,0.15) !important; }
        .gc-input::placeholder { color: #64748b !important; }
        .form-label { color: #94a3b8; font-size: 0.9rem; }

        .divider { border-top: 1px solid rgba(168,85,247,0.15); margin: 1.5rem 0 1.2rem; }
            .btn-purple { background: linear-gradient(135deg,#a855f7,#7c3aed); color:#fff; border:none; width:100%; padding:.875rem; border-radius:12px; font-weight:700; font-size:1rem; transition:all .3s; }
        .btn-purple:hover { background: linear-gradient(135deg,#7c3aed,#6d28d9); transform:translateY(-1px); box-shadow:0 8px 25px rgba(168,85,247,.5); color:#fff; }
</style>
</head>
<body>
    <header class="gc-header py-3 sticky-top">
        <div class="container">
            <div class="d-flex align-items-center justify-content-between flex-wrap">
                <a href="index.html" class="text-decoration-none text-light d-flex align-items-center">
                    <span class="gc-logo-square me-2"></span>
                    <h1 class="h4 mb-0">GameCube</h1>
                </a>
                <nav class="d-flex align-items-center gap-3 mt-2 mt-md-0 gc-desktop-nav"></nav>
        <button class="gc-hamburger" id="gcHamburger" aria-label="Menü megnyitása">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>
    
    <div class="gc-mobile-nav" id="gcMobileNav">
        <a href="index.html" class="gc-mobile-nav-logo">
            <span class="gc-logo-square"></span>
            <h1 class="h5 mb-0" style="font-family:'Orbitron',sans-serif;">GameCube</h1>
        </a>

        <div id="gcMobGreeting" class="gc-mobile-nav-greeting" style="display:none;"></div>

        <a href="index.html" class="gc-mobile-nav-item">
            <i class="bi bi-house"></i> Főoldal
        </a>
        
        <div class="gc-mobile-nav-divider"></div>
        <a href="profile.html" class="gc-mobile-nav-item" id="gcMobProfile" style="display:none;">
            <i class="bi bi-person"></i> Profil
        </a>
        <a href="admin.html" class="gc-mobile-nav-item warning" id="gcMobAdmin" style="display:none;">
        <a href="seller.html" class="gc-mobile-nav-item" id="gcMobSeller" style="display:none;">
            <i class="bi bi-shop"></i> Eladó panel
        </a>
            <i class="bi bi-shield-check"></i> Admin panel
        </a>
        <div class="gc-mobile-nav-divider" id="gcMobAuthDivider"></div>
        <div id="gcMobAuthButtons">
            <a href="login.html" class="gc-mobile-nav-item" style="margin-bottom:0.6rem; display:block; text-align:center; text-decoration:none; color:#f1f5f9;">
                <i class="bi bi-box-arrow-in-right"></i> Bejelentkezés
            </a>
            <a href="register.html" class="gc-mobile-nav-item primary" style="display:block; text-align:center; text-decoration:none; color:#fff;">
                <i class="bi bi-person-plus"></i> Regisztráció
            </a>
        </div>
        <button class="gc-mobile-nav-item danger" id="gcMobLogout" style="display:none; border:none;">
            <i class="bi bi-box-arrow-right"></i> Kilépés
        </button>
    </div>

    <section class="py-5 d-flex align-items-center" style="min-height:calc(100vh - 130px);">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5 col-lg-4">
                    <div class="text-center mb-4">
                        <h1 class="doc-title h2 text-white mb-1">Bejelentkezés</h1>
                        <p style="color:#64748b;">Üdv vissza a GameCube-on!</p>
                    </div>

                    <div class="doc-container">
                        <div id="successMessage" class="mb-3 p-3" style="display:none; background:rgba(16,185,129,0.1); border:1px solid rgba(16,185,129,0.3); color:#10b981; border-radius:10px;"></div>
                        <div id="errorMessage" class="mb-3 p-3" style="display:none; background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); color:#f87171; border-radius:10px;"></div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email_or_username" class="form-label">Email vagy felhasználónév</label>
                                <input type="text" class="form-control gc-input" id="email_or_username" name="email_or_username" required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label">Jelszó</label>
                                <input type="password" class="form-control gc-input" id="password" name="password" required>
                            </div>
                            <button type="submit" class="btn btn-purple mb-2">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Bejelentkezés
                            </button>
                        </form>

                        <div class="divider"></div>
                        <p class="text-center mb-2" style="color:#64748b; font-size:0.9rem;">Még nincs fiókod?</p>
                        <a href="register.html" class="btn btn-outline-light w-100">Regisztráció</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="gc-footer py-5">
        <div class="container">
            <div class="row g-4">
                <div class="col-md-6">
                    <div class="d-flex align-items-center mb-3">
                        <span class="gc-logo-square me-2"></span>
                        <h5 class="mb-0 text-white">GameCube</h5>
                    </div>
                    <p class="text-light-50 mb-0"><i class="bi bi-c-circle me-1"></i>2026 GameCube<br>Digitális játék kulcsok azonnali kézbesítéssel</p>
                </div>
                <div class="col-md-6">
                    <h6 class="text-white mb-3">Hasznos linkek</h6>
                    <div class="gc-footer-links-grid">
                        <a href="aszf.html" class="gc-footer-link-card"><i class="bi bi-file-earmark-text"></i><span>ÁSZF</span></a>
                        <a href="adatkezeles.html" class="gc-footer-link-card"><i class="bi bi-shield-check"></i><span>Adatkezelés</span></a>
                        <a href="kapcsolat.html" class="gc-footer-link-card"><i class="bi bi-envelope"></i><span>Kapcsolat</span></a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/auth.js?v=fix3"></script>
    <script src="assets/js/login.js?v=fix3"></script>

    <script>
    // ── Mobil hamburger menü ──
    (function() {
        var btn = document.getElementById('gcHamburger');
        var nav = document.getElementById('gcMobileNav');
        if (!btn || !nav) return;

        btn.addEventListener('click', function() {
            var isOpen = nav.classList.contains('open');
            if (isOpen) {
                nav.classList.remove('open');
                btn.classList.remove('open');
                document.body.classList.remove('gc-nav-open');
            } else {
                syncMobileNav();
                nav.classList.add('open');
                btn.classList.add('open');
                document.body.classList.add('gc-nav-open');
            }
        });

        // Bezárás linkre kattintáskor
        nav.querySelectorAll('a').forEach(function(link) {
            link.addEventListener('click', function() {
                nav.classList.remove('open');
                btn.classList.remove('open');
                document.body.classList.remove('gc-nav-open');
            });
        });

        // Logout gomb a mobil menüben
        var mobLogout = document.getElementById('gcMobLogout');
        if (mobLogout) {
            mobLogout.addEventListener('click', function() {
                nav.classList.remove('open');
                btn.classList.remove('open');
                document.body.classList.remove('gc-nav-open');
                var desktopLogout = document.getElementById('logoutBtn');
                if (desktopLogout) desktopLogout.click();
            });
        }

        // Szinkronizálás a desktop nav állapotával
        function syncMobileNav() {
            // Greeting
            var greeting = document.getElementById('userGreeting');
            var mobGreeting = document.getElementById('gcMobGreeting');
            if (greeting && mobGreeting) {
                if (!greeting.classList.contains('d-none') && greeting.textContent.trim()) {
                    mobGreeting.textContent = greeting.textContent;
                    mobGreeting.style.display = 'block';
                } else {
                    mobGreeting.style.display = 'none';
                }
            }
            // Profil
            var profileItem = document.getElementById('profileNavItem');
            var mobProfile = document.getElementById('gcMobProfile');
            if (profileItem && mobProfile) {
                mobProfile.style.display = profileItem.classList.contains('d-none') ? 'none' : 'flex';
            }
            // Admin
            var adminItem = document.getElementById('adminNavItem');
            var mobAdmin = document.getElementById('gcMobAdmin');
            if (adminItem && mobAdmin) {
                mobAdmin.style.display = adminItem.classList.contains('d-none') ? 'none' : 'flex';
            }
            // Seller
            var mobSeller = document.getElementById('gcMobSeller');
            if (mobSeller) {
                var u2 = localStorage.getItem('user');
                var showSeller = false;
                if (u2) { try { var up = JSON.parse(u2); showSeller = (up.role === 'seller' || up.role === 'both'); } catch(e){} }
                mobSeller.style.display = showSeller ? 'flex' : 'none';
            }
            // Auth buttons
            var authBtns = document.getElementById('authButtons');
            var mobAuthBtns = document.getElementById('gcMobAuthButtons');
            if (authBtns && mobAuthBtns) {
                mobAuthBtns.style.display = authBtns.style.display === 'none' ? 'none' : 'block';
            }
            // Logout
            var desktopLogout = document.getElementById('logoutBtn');
            var mobLogoutBtn = document.getElementById('gcMobLogout');
            if (desktopLogout && mobLogoutBtn) {
                mobLogoutBtn.style.display = desktopLogout.style.display === 'none' ? 'none' : 'flex';
            }
            // Kosár badge
            var cartBadge = document.getElementById('cartBadge');
            var mobCartBadge = document.getElementById('gcMobCartBadge');
            if (cartBadge && mobCartBadge) {
                if (cartBadge.style.display !== 'none') {
                    mobCartBadge.textContent = cartBadge.textContent;
                    mobCartBadge.style.display = 'inline-block';
                } else {
                    mobCartBadge.style.display = 'none';
                }
            }
        }
    })();
    </script>
</body>
</html>
